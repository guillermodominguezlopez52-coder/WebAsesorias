<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Maestro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #6e45e2, #88d3f9);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin: 20px 0;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #2575fc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1a68e8;
        }
        .logout-link {
            display: block;
            margin-top: 25px;
            color: #e74c3c;
            text-decoration: none;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Bienvenido, Maestro {{ nombre }}!</h1>
        <p>Estás en tu panel de maestro.</p>
        
        <a href="{{ url_for('maestro_alumnos') }}" class="btn">Ver Lista de Alumnos</a>
        <a href="{{ url_for('maestro_notificaciones') }}" class="btn">Notificaciones</a>
        <a href="{{ url_for('maestro_temas') }}" class="btn">Temas</a>
        <a href="{{ url_for('maestro_calificaciones') }}" class="btn">Calificaciones</a>
        
        <a href="{{ url_for('logout') }}" class="logout-link">Cerrar sesión</a>
    </div>
</body>
</html>
