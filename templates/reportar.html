<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportar Usuario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #6e45e2, #88d3f9);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #2575fc;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #1a68e8;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2575fc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reportar Usuario</h1>
        <form method="POST" action="{{ url_for('enviar_reporte') }}">
            <input type="hidden" name="user_id_reportado" value="{{ user_id_reportado }}">
            <label for="razon">Razón del reporte *</label>
            <select name="razon" id="razon" required>
                <option value="">Selecciona una opción</option>
                <option value="Comportamiento inapropiado">Comportamiento inapropiado</option>
                <option value="Contenido inadecuado">Contenido inadecuado</option>
                <option value="Otro">Otro</option>
            </select>

            <label for="comentarios">Comentarios (opcional)</label>
            <textarea name="comentarios" id="comentarios" rows="4" placeholder="Describe el problema..."></textarea>

            <button type="submit">Enviar Reporte</button>
        </form>
        <a href="{{ url_for('alumno_temas') }}" class="back-link">← Volver a Temas</a>
    </div>
</body>
</html>
