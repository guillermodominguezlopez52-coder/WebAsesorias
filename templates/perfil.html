<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #6e45e2, #88d3f9);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 1.25rem;
            margin-top: -10px;
            margin-bottom: 30px;
            color: #666;
        }
        .profile-grid {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
        }
        .profile-pic-container {
            text-align: center;
            min-width: 150px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto;
            color: #6e45e2;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background: #f9f9f9;
            color: #555;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-control {
            flex: 1;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 2rem 0;
        }
        .insignia-list {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .insignia {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            background: #f0f2f5;
            transition: all 0.2s;
        }
        .insignia.selected {
            background: #6e45e2;
            color: white;
        }
        .insignia:hover {
            transform: scale(1.1);
        }
        .btn {
            padding: 10px 20px;
            background: #6e45e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .logout-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #e74c3c;
            text-decoration: none;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi Perfil</h1>
        <p class="subtitle">Personaliza tu información y preferencias.</p>

        <div class="profile-grid">
            <div class="profile-pic-container">
                <div class="profile-pic">👤</div>
                <button class="btn" type="button" style="margin-top: 10px;">Subir Foto</button>
                <small style="display: block; margin-top: 0.5rem; opacity: 0.7;">(Esta función requiere desarrollo adicional)</small>
            </div>

            <div class="profile-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" class="form-control" value="{{ user.nombre }}" disabled>
                </div>

                <div class="form-group">
                    <label>Rol</label>
                    <input type="text" class="form-control" 
                           value="{% if user.rol == 'alumno' %}Alumno{% else %}Maestro{% endif %}" 
                           disabled>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="form-row">
                        <input type="text" class="form-control" value="{{ user.email }}" disabled>
                        <button class="btn" type="button">Verificar</button>
                    </div>
                </div>

                <div class="divider"></div>

                <h3>Preferencias</h3>

                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="dark-mode" style="margin-bottom: 0;">Modo Oscuro</label>
                    <label class="switch">
                        <input type="checkbox" id="dark-mode" disabled>
                        <span class="slider"></span>
                    </label>
                </div>
                <small style="display: block; margin-top: -1rem; margin-bottom: 1.5rem; opacity: 0.7;">(Función en desarrollo)</small>

                <div class="form-group">
                    <label>Elige tu Insignia</label>
                    <div class="insignia-list">
                        <span class="insignia selected">🎓</span>
                        <span class="insignia">🚀</span>
                        <span class="insignia">💡</span>
                        <span class="insignia">🧠</span>
                        <span class="insignia">⚡</span>
                    </div>
                </div>

                <button type="submit" class="btn" disabled>
                    Guardar Cambios (Deshabilitado)
                </button>
            </div>
        </div>
        
        <a href="{{ url_for('logout') }}" class="logout-link">Cerrar Sesión</a>
    </div>

    <script>
        // Hacer funcionales las insignias
        document.querySelectorAll('.insignia').forEach(insignia => {
            insignia.addEventListener('click', () => {
                document.querySelectorAll('.insignia').forEach(i => i.classList.remove('selected'));
                insignia.classList.add('selected');
            });
        });
    </script>
</body>
</html>
